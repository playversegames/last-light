<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Last Light · Playverse</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#12101f;color:#f2efff;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:500;overflow:hidden;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none}
.ov{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));background:rgba(12,10,28,.9);pointer-events:auto;text-align:center}
.logo b{display:block;font-size:3.2rem;font-weight:800;line-height:1;background:linear-gradient(90deg,#ff4d8d,#6c4dff,#27c9f5);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{font-size:2.4rem}.logo span{display:block;font-size:1rem;color:#a9a4d6}
h2{margin:0;font-size:2rem;font-weight:800}p{margin:0}.mut{color:#a9a4d6;font-size:.9rem}.er{color:#ff4d8d;font-weight:700}
.tw{background:#221d45;border-radius:16px;padding:12px 16px;max-width:340px}
button{font:inherit;font-weight:700;border:0;border-radius:16px;padding:14px 18px;color:#fff;background:linear-gradient(90deg,#ff4d8d,#6c4dff);width:100%;max-width:340px;min-height:50px}
button.g{background:#221d45}button:disabled{opacity:.4}button.s{width:auto;min-height:40px;padding:8px 14px}
input{font:inherit;width:100%;max-width:340px;padding:13px;border-radius:14px;border:2px solid #3b3470;background:#221d45;color:#fff;text-align:center}
.card{display:flex;flex-direction:column;gap:2px;text-align:left;background:#221d45;border:2px solid #6c4dff}.card small{color:#a9a4d6;font-weight:500}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#221d45;border-radius:14px;padding:10px 14px;width:100%;max-width:340px;text-align:left}.row.me{outline:2px solid #ff4d8d}
.list{display:grid;gap:8px;width:100%;max-width:340px}
</style></head><body>
<canvas id="c"></canvas><div id="ui"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,query,orderBy,limit,getDocs,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDHcp44KXR6Gax_Vf3fwdinWBgJB4l_92Y",authDomain:"clue-rush-a7bbe.firebaseapp.com",projectId:"clue-rush-a7bbe",storageBucket:"clue-rush-a7bbe.firebasestorage.app",messagingSenderId:"439710542707",appId:"1:439710542707:web:b55e0a8f2c309b86e8b306"});
const auth=getAuth(app),fs=getFirestore(app);let uid=null;
const ready=signInAnonymously(auth).then(c=>{uid=c.user.uid}).catch(()=>{});
const $=id=>document.getElementById(id),cv=$("c"),g=cv.getContext("2d"),ui=$("ui");
let W,H;const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};rs();addEventListener("resize",rs);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let save=JSON.parse(ls.get("ll-save")||"null")||{coins:0,up:{hp:0,dmg:0,spd:0,coin:0},best:0,name:""};
const sv=()=>ls.set("ll-save",JSON.stringify(save)),esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const UP=[["hp","❤️ Vitality","+10 max HP",50],["dmg","⚔️ Power","+10% damage",60],["spd","👟 Speed","+5% speed",50],["coin","🪙 Greed","+10% coins",70]],MAXL=10,cost=(i,l)=>UP[i][3]*(l+1);
const MODS=[["🩸 Blood Moon","Monsters are faster, gems are worth double"],["❄️ Frost Night","You move slower, monsters are weaker"],["🐝 Swarm Day","Many more monsters, more gems"],["🍀 Lucky Day","Coins are worth double"]],MOD=Math.floor(Date.now()/864e5)%4;
const OPT=[["bolt","🔮 Magic Bolt"],["blade","🌀 Spin Blades"],["light","⚡ Lightning"],["nova","🔥 Fire Nova"],["spd","👟 Swift Boots"],["vit","❤️ Vitality"],["mag","🧲 Magnet"],["arm","🛡️ Armor"]];
const DESC={bolt:"More and stronger bolts",blade:"Blades orbit and shred enemies",light:"Strikes random enemies",nova:"Burning ring around you",spd:"Move faster",vit:"+20 max HP and slow healing",mag:"Pick up gems from farther",arm:"Take less damage"};
const TY=[["🦇",12,95,12,5,1],["🧟",30,55,16,8,2],["👹",100,48,22,14,5]],BOSS=[["🗿",900,42,34,20,40],["👻",700,80,30,16,40]];
let G,state="menu",last=0,jx=0,jy=0,ox=0,oy=0,sx=0,sy=0,tid=null;const keys={};
async function claim(n){n=n.trim();if(n.length<2||/^robot/i.test(n))return false;const r=doc(fs,"names",encodeURIComponent(n.toLowerCase().replace(/\s+/g," ")));let s;try{s=await getDoc(r)}catch(e){return true}
  if(s.exists()&&s.data().uid!==uid)return false;try{if(!s.exists())await setDoc(r,{uid,name:n})}catch(e){return false}return true}
function run(){const mh=100+save.up.hp*10;
  G={t:0,k:0,coins:0,x:0,y:0,hp:mh,mh,xp:0,need:5,lv:1,l:{bolt:1,blade:0,light:0,nova:0,spd:0,vit:0,mag:0,arm:0},en:[],pr:[],gm:[],cn:[],fx:[],cd:{b:0,l:0,n:0},ang:0,inv:0,pause:false,sp:0,boss:0};
  ui.innerHTML="";state="play";last=performance.now();requestAnimationFrame(loop)}
function loop(now){if(state!=="play")return;const dt=Math.min(.05,(now-last)/1000);last=now;if(!G.pause)upd(dt);draw();requestAnimationFrame(loop)}
function spawn(b){const a=Math.random()*6.283,R=Math.hypot(W,H)/2+60,t=G.t,sc=1+t/80*(MOD===1?.8:1);
  const T=b?BOSS[(G.boss-1)%2]:TY[t<45?0:t<120?(Math.random()<.7?0:1):(Math.random()<.5?1:Math.random()<.5?0:2)],hp=T[1]*sc*(b?1+(G.boss-1)*.7:1);
  G.en.push({x:G.x+Math.cos(a)*R,y:G.y+Math.sin(a)*R,e:T[0],hp,mhp:hp,sp:T[2],r:T[3],dmg:T[4],xp:T[5],boss:!!b})}
function nearest(max){let b=null,bd=max*max;for(const e of G.en){const d=(e.x-G.x)**2+(e.y-G.y)**2;if(d<bd){bd=d;b=e}}return b}
function die(e){G.k++;G.gm.push({x:e.x,y:e.y,v:e.xp*(MOD===0?2:MOD===2?1.5:1)});
  if(e.boss){G.hp=G.mh;for(let i=0;i<8;i++)G.gm.push({x:e.x+Math.cos(i)*30,y:e.y+Math.sin(i)*30,v:6});G.cn.push({x:e.x,y:e.y,v:10})}else if(Math.random()<.07)G.cn.push({x:e.x,y:e.y,v:1})}
function upd(dt){const l=G.l,dm=1+save.up.dmg*.1;G.t+=dt;G.inv-=dt;G.ang+=dt*3;
  let dx=jx+(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=jy+(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);const d=Math.hypot(dx,dy);if(d>1){dx/=d;dy/=d}
  const sp=150*(1+save.up.spd*.05+l.spd*.08)*(MOD===1?.9:1);G.x+=dx*sp*dt;G.y+=dy*sp*dt;
  G.hp=Math.min(G.mh,G.hp+l.vit*.4*dt);
  G.sp+=dt*(1.3+G.t/35)*(MOD===2?1.5:1);while(G.sp>=1){G.sp--;if(G.en.length<170)spawn()}
  if(G.t>=180*(G.boss+1)){G.boss++;spawn(true)}
  G.cd.b-=dt;if(G.cd.b<=0){const t=nearest(520);if(t){G.cd.b=Math.max(.35,.9-l.bolt*.07);const n=1+(l.bolt>>1),a0=Math.atan2(t.y-G.y,t.x-G.x);
    for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*.22;G.pr.push({x:G.x,y:G.y,vx:Math.cos(a)*420,vy:Math.sin(a)*420,d:(10+l.bolt*5)*dm,p:1+(l.bolt>>1),life:1.3,h:new Set()})}}}
  for(let i=G.pr.length-1;i>=0;i--){const p=G.pr[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    for(const e of G.en){if(p.h.has(e))continue;if((e.x-p.x)**2+(e.y-p.y)**2<(e.r+6)**2){e.hp-=p.d;p.h.add(e);if(--p.p<=0){p.life=0;break}}}
    if(p.life<=0)G.pr.splice(i,1)}
  G.blades=[];for(let i=0;i<l.blade;i++){const a=G.ang+i*6.283/l.blade;G.blades.push({x:G.x+Math.cos(a)*80,y:G.y+Math.sin(a)*80})}
  for(const b of G.blades)for(const e of G.en)if((e.x-b.x)**2+(e.y-b.y)**2<(e.r+12)**2)e.hp-=(30+l.blade*12)*dm*dt;
  G.cd.l-=dt;if(l.light&&G.cd.l<=0){G.cd.l=Math.max(.6,1.8-l.light*.2);const c=G.en.filter(e=>(e.x-G.x)**2+(e.y-G.y)**2<160000);
    for(let i=0;i<l.light&&c.length;i++){const e=c.splice(Math.random()*c.length|0,1)[0];e.hp-=(45+l.light*15)*dm;G.fx.push({t:"l",x:e.x,y:e.y,life:.2})}}
  G.cd.n-=dt;if(l.nova&&G.cd.n<=0){G.cd.n=4.2-l.nova*.3;const r=110+l.nova*18;for(const e of G.en)if((e.x-G.x)**2+(e.y-G.y)**2<(r+e.r)**2)e.hp-=(35+l.nova*14)*dm;G.fx.push({t:"n",r,life:.35})}
  for(let i=G.en.length-1;i>=0;i--){const e=G.en[i];if(e.hp<=0){die(e);G.en[i]=G.en[G.en.length-1];G.en.pop();continue}
    const ex=G.x-e.x,ey=G.y-e.y,dd=Math.hypot(ex,ey)||1,s=e.sp*(MOD===0?1.2:1)*dt;e.x+=ex/dd*s;e.y+=ey/dd*s;
    if(dd<e.r+12&&G.inv<=0){G.hp-=e.dmg*(1-.08*l.arm);G.inv=.5;if(navigator.vibrate)navigator.vibrate(25)}}
  const mr=70+l.mag*45;
  for(const arr of [G.gm,G.cn])for(let i=arr.length-1;i>=0;i--){const o=arr[i],ex=G.x-o.x,ey=G.y-o.y,dd=Math.hypot(ex,ey)||1;if(dd<mr){o.x+=ex/dd*320*dt;o.y+=ey/dd*320*dt}
    if(dd<16){if(arr===G.gm)G.xp+=o.v;else G.coins+=o.v*(1+save.up.coin*.1)*(MOD===3?2:1);arr.splice(i,1)}}
  for(let i=G.fx.length-1;i>=0;i--){G.fx[i].life-=dt;if(G.fx[i].life<=0)G.fx.splice(i,1)}
  if(G.hp<=0)return over();if(G.xp>=G.need)lvlup()}
function lvlup(){G.lv++;G.xp-=G.need;G.need=Math.floor(G.need*1.35+3);const pool=OPT.filter(o=>G.l[o[0]]<5),ch=[];while(ch.length<3&&pool.length)ch.push(pool.splice(Math.random()*pool.length|0,1)[0]);if(!ch.length)return;G.pause=true;
  ui.innerHTML=`<div class="ov"><h2>Level ${G.lv}!</h2>${ch.map(o=>`<button class="card" data-k="${o[0]}"><b>${o[1]} · Lv ${G.l[o[0]]+1}</b><small>${DESC[o[0]]}</small></button>`).join("")}</div>`}
function draw(){g.fillStyle="#12101f";g.fillRect(0,0,W,H);const cx=G.x-W/2,cy=G.y-H/2;
  g.strokeStyle="#1f1b38";g.lineWidth=1;g.beginPath();for(let x=-(cx%90);x<W;x+=90){g.moveTo(x,0);g.lineTo(x,H)}for(let y=-(cy%90);y<H;y+=90){g.moveTo(0,y);g.lineTo(W,y)}g.stroke();
  g.textAlign="center";g.textBaseline="middle";
  g.fillStyle="#4df";for(const o of G.gm){g.beginPath();g.arc(o.x-cx,o.y-cy,5,0,6.3);g.fill()}
  g.fillStyle="#ffc83d";for(const o of G.cn){g.beginPath();g.arc(o.x-cx,o.y-cy,6,0,6.3);g.fill()}
  for(const e of G.en){g.font=`${e.r*2}px serif`;g.fillText(e.e,e.x-cx,e.y-cy);if(e.boss){g.fillStyle="#400";g.fillRect(e.x-cx-30,e.y-cy-e.r-14,60,6);g.fillStyle="#f45";g.fillRect(e.x-cx-30,e.y-cy-e.r-14,60*Math.max(0,e.hp/e.mhp),6)}}
  g.fillStyle="#b9f";for(const p of G.pr){g.beginPath();g.arc(p.x-cx,p.y-cy,6,0,6.3);g.fill()}
  g.fillStyle="#fff";for(const b of G.blades||[]){g.beginPath();g.arc(b.x-cx,b.y-cy,10,0,6.3);g.fill()}
  for(const f of G.fx){if(f.t==="l"){g.strokeStyle="#ff6";g.lineWidth=4;g.beginPath();g.moveTo(f.x-cx,0);g.lineTo(f.x-cx,f.y-cy);g.stroke()}else{g.strokeStyle="rgba(255,120,40,"+f.life*2.5+")";g.lineWidth=6;g.beginPath();g.arc(W/2,H/2,f.r*(1.4-f.life),0,6.3);g.stroke()}}
  g.globalAlpha=G.inv>0&&((G.inv*20|0)%2)?.4:1;g.font="36px serif";g.fillText("🧙",W/2,H/2);g.globalAlpha=1;
  const bw=Math.min(220,W-150);g.fillStyle="#400";g.fillRect(12,14,bw,12);g.fillStyle="#ff4d8d";g.fillRect(12,14,bw*Math.max(0,G.hp/G.mh),12);
  g.fillStyle="#223";g.fillRect(0,0,W,6);g.fillStyle="#27c9f5";g.fillRect(0,0,W*G.xp/G.need,6);
  g.fillStyle="#fff";g.font="bold 16px sans-serif";g.textAlign="right";g.fillText(`${fmt(Math.floor(G.t))} · Lv ${G.lv} · ${G.k} kills`,W-12,22);
  if(tid!==null){g.strokeStyle="rgba(255,255,255,.35)";g.lineWidth=3;g.beginPath();g.arc(ox,oy,55,0,6.3);g.stroke();g.fillStyle="rgba(255,255,255,.35)";g.beginPath();g.arc(sx,sy,22,0,6.3);g.fill()}}
async function over(){state="over";const t=Math.floor(G.t),c=Math.round(G.coins),nb=t>save.best;save.coins+=c;if(nb)save.best=t;sv();
  ui.innerHTML=`<div class="ov"><h2>You fell 💀</h2><p>Survived <b>${fmt(t)}</b> · ${G.k} kills · +${c} coins${nb?" · new best!":""}</p><button data-a="play">Play again</button><button class="g" data-a="menu">Menu</button></div>`;
  if(nb&&save.name){await ready;if(uid)setDoc(doc(fs,"lastlight",uid),{name:save.name,best:t,kills:G.k,at:serverTimestamp()},{merge:true}).catch(()=>{})}}
function menu(){state="menu";g.fillStyle="#12101f";g.fillRect(0,0,W,H);
  ui.innerHTML=`<div class="ov"><div class="logo">🔦<b>Last Light</b><span>Survive the endless night</span></div>${save.name?`<p>Hero: <b>${esc(save.name)}</b> · Best ${fmt(save.best)} · 🪙 ${save.coins}</p>`:`<input id="nm" maxlength="16" placeholder="Choose your hero name"><p id="er" class="er"></p>`}
  <p class="tw"><b>Today: ${MODS[MOD][0]}</b><br>${MODS[MOD][1]}</p><button data-a="play">Play</button><button class="g" data-a="shop">Shop</button><button class="g" data-a="board">🏆 Leaderboard</button><p class="mut">Drag to move. Your hero attacks by itself.</p></div>`}
function shop(){ui.innerHTML=`<div class="ov"><h2>Shop · 🪙 ${save.coins}</h2>${UP.map((u,i)=>{const l=save.up[u[0]],c=cost(i,l);return `<div class="row"><span><b>${u[1]}</b> Lv ${l}<br><small>${u[2]}</small></span><button class="s" data-buy="${i}" ${l>=MAXL||save.coins<c?"disabled":""}>${l>=MAXL?"MAX":"🪙 "+c}</button></div>`}).join("")}<button class="g" data-a="menu">Back</button></div>`}
async function board(){ui.innerHTML=`<div class="ov"><h2>🏆 Longest survival</h2><p class="mut">Loading…</p></div>`;let rows=[];
  try{await ready;rows=(await getDocs(query(collection(fs,"lastlight"),orderBy("best","desc"),limit(15)))).docs.map(d=>({id:d.id,...d.data()}))}catch(e){}
  ui.innerHTML=`<div class="ov"><h2>🏆 Longest survival</h2><div class="list">${rows.length?rows.map((r,i)=>`<div class="row${r.id===uid?" me":""}"><b>${i+1}. ${esc(r.name||"Hero")}</b><span>${fmt(r.best)} · ${r.kills||0} kills</span></div>`).join(""):"<p class='mut'>No scores yet. Be the first!</p>"}</div><button class="g" data-a="menu">Back</button></div>`}
async function ready2(){if(save.name)return true;const v=($("nm")||{}).value||"",er=$("er");if(v.trim().length<2){er.textContent="Enter a name (2+ letters).";return false}
  await ready;if(!(await claim(v))){er.textContent="That name is taken. Choose another.";return false}save.name=v.trim();sv();return true}
ui.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.a;
  if(b.dataset.k){G.l[b.dataset.k]++;if(b.dataset.k==="vit"){G.mh+=20;G.hp+=20}ui.innerHTML="";G.pause=false}
  else if(b.dataset.buy){const i=+b.dataset.buy,l=save.up[UP[i][0]],c=cost(i,l);if(save.coins>=c&&l<MAXL){save.coins-=c;save.up[UP[i][0]]++;sv();shop()}}
  else if(a==="play"){if(await ready2())run()}else if(a==="menu")menu();else if(a==="shop")shop();else if(a==="board")board()});
cv.addEventListener("pointerdown",e=>{tid=e.pointerId;ox=sx=e.clientX;oy=sy=e.clientY;jx=jy=0});
cv.addEventListener("pointermove",e=>{if(e.pointerId!==tid)return;let dx=e.clientX-ox,dy=e.clientY-oy;const d=Math.hypot(dx,dy),m=55;if(d>m){dx=dx/d*m;dy=dy/d*m}jx=dx/m;jy=dy/m;sx=ox+dx;sy=oy+dy});
const up=e=>{if(e.pointerId===tid){tid=null;jx=jy=0}};cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
addEventListener("keydown",e=>keys[e.key]=true);addEventListener("keyup",e=>keys[e.key]=false);
menu();
</script></body></html>
