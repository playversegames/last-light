  for(const b of G.blades)for(const e of G.en)if((e.x-b.x)**2+(e.y-b.y)**2<(e.r+12)**2){e.hp-=(30+l.blade*12)*dm*dt;e.fl=.05}
  G.cd.l-=dt;if(l.light&&G.cd.l<=0){G.cd.l=Math.max(.6,1.8-l.light*.2);const c=G.en.filter(e=>(e.x-G.x)**2+(e.y-G.y)**2<160000);
    for(let i=0;i<l.light&&c.length;i++){const e=c.splice(Math.random()*c.length|0,1)[0];hit(e,(45+l.light*15)*dm);G.fx.push({t:"l",x:e.x,y:e.y,life:.2})}}
  G.cd.n-=dt;if(l.nova&&G.cd.n<=0){G.cd.n=4.2-l.nova*.3;const r=110+l.nova*18;for(const e of G.en)if((e.x-G.x)**2+(e.y-G.y)**2<(r+e.r)**2)hit(e,(35+l.nova*14)*dm);G.fx.push({t:"n",r,life:.35})}
  for(let i=G.en.length-1;i>=0;i--){const e=G.en[i];if(e.hp<=0){die(e);G.en[i]=G.en[G.en.length-1];G.en.pop();continue}
    e.fl-=dt;const ex=G.x-e.x,ey=G.y-e.y,dd=Math.hypot(ex,ey)||1,s=e.sp*(MOD===0?1.2:1)*dt;e.x+=ex/dd*s;e.y+=ey/dd*s;
    if(dd<e.r+12&&G.inv<=0){G.hp-=e.dmg*(1-.08*l.arm);G.inv=.5;G.sh=9;snd("hurt");burst(G.x,G.y,8,"#ff4d8d");if(navigator.vibrate)navigator.vibrate(25)}}
  const mr=70+l.mag*45;
  for(const arr of [G.gm,G.cn])for(let i=arr.length-1;i>=0;i--){const o=arr[i],ex=G.x-o.x,ey=G.y-o.y,dd=Math.hypot(ex,ey)||1;if(dd<mr){o.x+=ex/dd*320*dt;o.y+=ey/dd*320*dt}
    if(dd<16){if(arr===G.gm){G.xp+=o.v;snd("gem")}else{G.coins+=o.v*(1+save.up.coin*.1)*(MOD===3?2:1);snd("coin")}arr.splice(i,1)}}
  for(let i=G.fx.length-1;i>=0;i--){G.fx[i].life-=dt;if(G.fx[i].life<=0)G.fx.splice(i,1)}
  for(let i=G.pt.length-1;i>=0;i--){const p=G.pt[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;if((p.l-=dt)<=0)G.pt.splice(i,1)}
  for(let i=G.dn.length-1;i>=0;i--){const d=G.dn[i];d.y-=30*dt;if((d.l-=dt)<=0)G.dn.splice(i,1)}
  if(G.hp<=0)return over();if(G.xp>=G.need)lvlup()}
function lvlup(){burst(G.x,G.y,36,"#6cf");snd("lvl");G.lv++;G.xp-=G.need;G.need=Math.floor(G.need*1.35+3);const pool=OPT.filter(o=>G.l[o[0]]<5),ch=[];while(ch.length<3&&pool.length)ch.push(pool.splice(Math.random()*pool.length|0,1)[0]);if(!ch.length)return;G.pause=true;
  ui.innerHTML=`<div class="ov"><h2>Level ${G.lv}!</h2>${ch.map(o=>`<button class="card" data-k="${o[0]}"><b>${o[1]} · Lv ${G.l[o[0]]+1}</b><small>${DESC[o[0]]}</small></button>`).join("")}</div>`}
function draw(){const t=G.t,cx=G.x-W/2,cy=G.y-H/2;if(!gp)gp=ground();
  g.save();if(G.sh>.3){g.translate((Math.random()-.5)*G.sh,(Math.random()-.5)*G.sh);G.sh*=.9}
  g.fillStyle="#0b0a18";g.fillRect(-20,-20,W+40,H+40);g.save();g.translate(-(((cx%256)+256)%256),-(((cy%256)+256)%256));g.fillStyle=gp;g.fillRect(0,0,W+260,H+260);g.restore();
  g.fillStyle="#9ef";for(const o of G.gm){g.save();g.translate(o.x-cx,o.y-cy);g.rotate(.78);g.fillRect(-3,-3,6,6);g.restore()}
  g.fillStyle="#ffd24d";for(const o of G.cn){g.beginPath();g.arc(o.x-cx,o.y-cy,5,0,6.3);g.fill()}
  const ents=[...G.en].sort((a,b)=>a.y-b.y);let hd=false;for(const e of ents){if(!hd&&e.y>G.y){drawHero(W/2,H/2,t);hd=true}drawEnemy(e,e.x-cx,e.y-cy,t)}if(!hd)drawHero(W/2,H/2,t);
  light(cx,cy);g.globalCompositeOperation="lighter";
  for(const o of G.gm)glow(o.x-cx,o.y-cy,14,"#4df");for(const o of G.cn)glow(o.x-cx,o.y-cy,16,"#fc3");
  for(const e of G.en){const x=e.x-cx,y=e.y-cy;if(x>-60&&x<W+60&&y>-60&&y<H+60)glow(x,y-e.r*.3,e.r*1.1,e.k===3?"#2ff":e.k===4?"#9cf":"#f33")}
  for(const p of G.pr){glow(p.x-cx,p.y-cy,20,"#a7f");glow(p.x-cx,p.y-cy,8,"#fff")}
  for(const b of G.blades||[]){glow(b.x-cx,b.y-cy,24,"#7cf");glow(b.x-cx,b.y-cy,9,"#fff")}
  for(const p of G.pt)glow(p.x-cx,p.y-cy,3+10*Math.min(1,p.l/.5),p.c);
  for(const f of G.fx){if(f.t==="l"){glow(f.x-cx,f.y-cy,50,"#ff6")}else{g.strokeStyle="rgba(255,150,60,"+Math.min(1,f.life*3)+")";g.lineWidth=8;g.beginPath();g.arc(W/2,H/2,f.r*(1.4-f.life),0,6.3);g.stroke()}}
  g.globalCompositeOperation="source-over";
  for(const f of G.fx)if(f.t==="l"){g.strokeStyle="#ffe";g.lineWidth=3;g.beginPath();let yy=0;g.moveTo(f.x-cx,0);while(yy<f.y-cy){yy+=25;g.lineTo(f.x-cx+(Math.random()-.5)*22,Math.min(yy,f.y-cy))}g.stroke()}
  g.font="bold 14px sans-serif";g.textAlign="center";g.textBaseline="middle";for(const d of G.dn){g.globalAlpha=Math.min(1,d.l*3);g.fillStyle="#fff";g.fillText(d.v,d.x-cx,d.y-cy)}g.globalAlpha=1;
  g.restore();
  const vg=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,Math.hypot(W,H)/2);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.55)");g.fillStyle=vg;g.fillRect(0,0,W,H);
  const bw=Math.min(230,W-170);rr(12,16,bw,14,7);g.fillStyle="rgba(0,0,0,.55)";g.fill();
  if(G.hp>0){rr(12,16,Math.max(8,bw*G.hp/G.mh),14,7);const gr=g.createLinearGradient(12,0,12+bw,0);gr.addColorStop(0,"#ff4d8d");gr.addColorStop(1,"#ff9a5c");g.fillStyle=gr;g.fill()}
  g.fillStyle="#fff";g.font="bold 11px sans-serif";g.textAlign="left";g.fillText(`${Math.ceil(G.hp)}/${G.mh}`,18,24);g.font="bold 14px sans-serif";g.fillText(`🪙 ${Math.round(G.coins)}`,14,46);
  g.fillStyle="rgba(0,0,0,.5)";g.fillRect(0,0,W,6);const xg=g.createLinearGradient(0,0,W,0);xg.addColorStop(0,"#27c9f5");xg.addColorStop(1,"#6c4dff");g.fillStyle=xg;g.fillRect(0,0,W*G.xp/G.need,6);
  g.fillStyle="#fff";g.font="bold 16px sans-serif";g.textAlign="right";g.fillText(`${fmt(Math.floor(G.t))} · Lv ${G.lv} · ${G.k} kills`,W-12,24);
  if(G.warn>0){g.globalAlpha=Math.min(1,G.warn)*(.6+.4*Math.sin(G.t*14));g.textAlign="center";g.fillStyle="#ff4d5c";g.font="bold 26px sans-serif";g.fillText("⚠ BOSS APPROACHES ⚠",W/2,H*.22);g.globalAlpha=1}
  if(tid!==null){g.strokeStyle="rgba(255,255,255,.35)";g.lineWidth=3;g.beginPath();g.arc(ox,oy,55,0,6.3);g.stroke();g.fillStyle="rgba(255,255,255,.35)";g.beginPath();g.arc(sx,sy,22,0,6.3);g.fill()}}
async function over(){state="over";const t=Math.floor(G.t),c=Math.round(G.coins),nb=t>save.best;save.coins+=c;if(nb)save.best=t;const gain=Math.round(t+G.k/2),r0=rankOf(save.xp).l;save.xp+=gain;const r1=rankOf(save.xp).l;ls.set("ll-run","");sv();
  ui.innerHTML=`<div class="ov"><h2>You fell 💀</h2><p>Survived <b>${fmt(t)}</b> · ${G.k} kills · +${c} coins · +${gain} XP${nb?" · new best!":""}${r1>r0?`<br>⭐ RANK UP! Rank ${r1}`:""}</p><button data-a="play">Play again</button><button class="g" data-a="menu">Menu</button></div>`;
  if(nb&&save.name){await ready;if(uid)setDoc(doc(fs,"lastlight",uid),{name:save.name,best:t,kills:G.k,at:serverTimestamp()},{merge:true}).catch(()=>{})}}
function menu(){state="menu";g.fillStyle="#12101f";g.fillRect(0,0,W,H);
  ui.innerHTML=`<div class="ov"><div class="logo">🔦<b>Last Light</b><span>Survive the endless night</span></div>${save.name?`<p>Hero: <b>${esc(save.name)}</b> · Best ${fmt(save.best)} · 🪙 ${save.coins}</p>`:`<input id="nm" maxlength="16" placeholder="Choose your hero name"><p id="er" class="er"></p>`}
  ${rankLine()}${acctLine()}<p class="tw"><b>Today: ${MODS[MOD][0]}</b><br>${MODS[MOD][1]}</p>${ls.get("ll-run")?`<button data-a="cont">▶ Continue run</button>`:""}<div class="heroes">${HEROES.map((h,i)=>`<button class="hero${save.hero===i?" on":""}" data-hero="${i}"><span class="hd" style="background:${h.c}"></span><b>${h.n}</b><small>${save.own[i]?h.d:"🔒 🪙 "+h.cost}</small></button>`).join("")}</div><button data-a="play">Play</button><button class="g" data-a="shop">Shop</button><button class="g" data-a="board">🏆 Leaderboard</button><button class="g" data-a="mute">${mute?"🔇 Sound off":"🔊 Sound on"}</button><p class="mut">Drag to move. Your hero attacks by itself.</p></div>`}
function shop(){ui.innerHTML=`<div class="ov"><h2>Shop · 🪙 ${save.coins}</h2>${UP.map((u,i)=>{const l=save.up[u[0]],c=cost(i,l);return `<div class="row"><span><b>${u[1]}</b> Lv ${l}<br><small>${u[2]}</small></span><button class="s" data-buy="${i}" ${l>=MAXL||save.coins<c?"disabled":""}>${l>=MAXL?"MAX":"🪙 "+c}</button></div>`}).join("")}<button class="g" data-a="menu">Back</button></div>`}
async function board(){ui.innerHTML=`<div class="ov"><h2>🏆 Longest survival</h2><p class="mut">Loading…</p></div>`;let rows=[];
  try{await ready;rows=(await getDocs(query(collection(fs,"lastlight"),orderBy("best","desc"),limit(15)))).docs.map(d=>({id:d.id,...d.data()}))}catch(e){}
  ui.innerHTML=`<div class="ov"><h2>🏆 Longest survival</h2><div class="list">${rows.length?rows.map((r,i)=>`<div class="row${r.id===uid?" me":""}"><b>${i+1}. ${esc(r.name||"Hero")}</b><span>${fmt(r.best)} · ${r.kills||0} kills</span></div>`).join(""):"<p class='mut'>No scores yet. Be the first!</p>"}</div><button class="g" data-a="menu">Back</button></div>`}
async function ready2(){if(save.name)return true;const v=($("nm")||{}).value||"",er=$("er");if(v.trim().length<2){er.textContent="Enter a name (2+ letters).";return false}
  await ready;if(!(await claim(v))){er.textContent="That name is taken. Choose another.";return false}save.name=v.trim();sv();return true}
ui.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.a;
  if(b.dataset.k){G.l[b.dataset.k]++;if(b.dataset.k==="vit"){G.mh+=20;G.hp+=20}ui.innerHTML="";G.pause=false}
  else if(b.dataset.hero!==undefined){const i=+b.dataset.hero,h=HEROES[i];if(save.own[i]){save.hero=i;sv();menu()}else if(save.coins>=h.cost){save.coins-=h.cost;save.own[i]=1;save.hero=i;sv();menu()}}
  else if(b.dataset.buy){const i=+b.dataset.buy,l=save.up[UP[i][0]],c=cost(i,l);if(save.coins>=c&&l<MAXL){save.coins-=c;save.up[UP[i][0]]++;sv();shop()}}
  else if(a==="play"){if(await ready2())run()}else if(a==="menu")menu();else if(a==="google")gsign();else if(a==="cont"){if(await ready2())resume()}else if(a==="mute"){mute=!mute;ls.set("ll-mute",mute?"1":"0");menu()}else if(a==="shop")shop();else if(a==="board")board()});
cv.addEventListener("pointerdown",e=>{tid=e.pointerId;ox=sx=e.clientX;oy=sy=e.clientY;jx=jy=0});
cv.addEventListener("pointermove",e=>{if(e.pointerId!==tid)return;let dx=e.clientX-ox,dy=e.clientY-oy;const d=Math.hypot(dx,dy),m=55;if(d>m){dx=dx/d*m;dy=dy/d*m}jx=dx/m;jy=dy/m;sx=ox+dx;sy=oy+dy});
const up=e=>{if(e.pointerId===tid){tid=null;jx=jy=0}};cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
addEventListener("keydown",e=>keys[e.key]=true);addEventListener("keyup",e=>keys[e.key]=false);
menu();ready.then(async()=>{await pull();if(state==="menu")menu()});
</script></body></html>
